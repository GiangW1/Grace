  alpha: 32.0
  dropout: 0.0
  targets: [q_proj, v_proj]
optim:
  lr: 0.0001
  betas: [0.9, 0.99]
  weight_decay: 0.0
  grad_clip: 1.0
baseline:
  ema_alpha: 0.7
  prescan: 4
hardware:
  name: cpu
  n_gpu: 0
analysis:
  answer_undecided: 0.15
  nonzero_signal_kappa: 0.05
  delta_answer: 0.05
  epsilon_learn: 0.2
