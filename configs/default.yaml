method: grace
backend: cpu_tiny
seed: 17
n_start: 8
n_prompts: 4
decision_tokens: 512
max_new_tokens: 2048
format_warmup:
  steps: 256
  batch_size: 8
temperature: 1.0
eval_temperature: 0.6
eval_top_p: 0.95
eval:
  k: 4
  n: 4
  max_new_tokens: 4096
  temperature: 0.6
  top_p: 0.95
allocation:
  p_min: 0.2
  beta: 0.5
  bisection_iters: 20
predictor:
  k: 8
  hidden_coord: 256
  hidden_risk: 64
