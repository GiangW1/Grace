# First GPU chain check. Finish this before Pilot scale.
# predictor.warmup_steps=0 means allocation starts immediately. health.json
# allocating_with_untrained_predictor is true only while the reservoir is empty.
# 1024/2048 plus format SFT (lead + Answer:, no gold/EOS).
# Still not Pilot (2048/4096).
method: grace
backend: gpu_verl
n_start: 16
n_prompts: 4
decision_tokens: 128
max_new_tokens: 1024
format_warmup:
  steps: 32
  batch_size: 4
predictor:
  warmup_steps: 0
  k: 4
  reservoir_size: 32
  audit_s: 0.125
  constant_cost: true
eval:
  n_problems: 8
  k: 2
  n: 2
  max_new_tokens: 2048
  temperature: 0.6
  top_p: 0.95
audit:
  n_problems: 8
  n_prefixes: 2
  # Format SFT can produce short answers; also exercise suffixes before EOS.
  decision_grid: [2, 4, 64, 128]
  n_continuations: 4
  max_new_tokens: 2048
  jl_dim: 256
