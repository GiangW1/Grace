# Fast first-pass experiment for prefix-conditioned scalar training value.
# The replay stores only a scalar per continuation in addition to the exact
# prefix mean, so n=16/64 can be checked before the n=256 follow-up.
experiment_variant: expected_gain_directional_audit
method: full_pg
decision_tokens: 512
max_new_tokens: 2048
audit:
  n_problems: 64
  n_prefixes: 2
  n_continuations: 64
  n_baseline: 8
  decision_grid: [512]
  max_new_tokens: 2048
  store_features: true
  predictor_diagnostic: false
hardware:
  name: a100
  n_gpu: 1
  gpu_memory_gb: 80
vllm:
  tensor_parallel: 1
  dtype: bfloat16
  gpu_memory_utilization: 0.5
