# Independent serving-path scheduler probe. Start vllm serve separately.
experiment_variant: phase12_scheduler_serve_probe
backend: vllm_serve
hardware:
  name: a100
  n_gpu: 1
  gpu_memory_gb: 80
scheduler_serve_probe:
  base_url: http://127.0.0.1:8000/v1
  # Must match the frozen actor/adapter id returned by GET /v1/models.
  # The serving command in docs/EXPERIMENTS_PHASE12_SERVE.md registers this
  # name with --lora-modules; do not silently fall back to the base model.
  server_model: grace-actor
  capacity: 8
  decision_tokens: 512
  max_new_tokens: 2048
  temperature: 0.2
  continuation_probabilities: [0.0, 0.5, 0.75, 1.0]
  repeats: 3
  workloads: [full_pg, fixed_ht]
  schedulers: [all, no_refill, refill]
  request_timeout_seconds: 600
  # null means one client worker per start for the all-request baseline.
  all_concurrency: null
  api_key_env: VLLM_API_KEY
